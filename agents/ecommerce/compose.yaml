services:
  postgres:
    image: postgres@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_DB: commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run local setup first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - commerce_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerce"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  commerce_data:
