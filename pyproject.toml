[project]
name = "google-adk-e2e-agent-suite"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-adk[db,mcp]==2.13.0",
  "fastapi",
  "uvicorn",
  "pydantic-settings",
  "aiosqlite",
  "httpx",
  "google-auth",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "detect-secrets"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: requires authenticated external providers"]
